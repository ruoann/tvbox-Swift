
# TVBox-Swift 云端构建 IPA 工作流
name: Build TVBox IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    name: Build unsigned IPA
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show schemes
        run: xcodebuild -list

      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -scheme tvbox \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/tvbox.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=""

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/tvbox.xcarchive/Products/Applications/tvbox.app build/Payload/
          cd build
          zip -qry TVBox-unsigned.ipa Payload
          ls -lh TVBox-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-unsigned-ipa
          path: build/TVBox-unsigned.ipa
          if-no-files-found: error
